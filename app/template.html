<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glask · Faceless Guild Management</title>
<link rel="icon" type="image/png" href="data:image/png;base64,__MASK__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0c0c;--panel:#161414;--panel2:#1d1a1a;--line:#2c2727;--text:#e9e3dc;--mute:#9a918a;--dim:#6d6560;--ember:#c8452c;--ember2:#e8774f;--bone:#d9cbb4;--ok:#6fae7c;--warn:#d8a24a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(13,12,12,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar{display:flex;align-items:center;gap:18px;padding:12px 22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;display:block}
.brand h1{font:700 20px Cinzel,serif;letter-spacing:.12em;margin:0;color:var(--bone)}
.brand small{display:block;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{background:none;border:0;color:var(--mute);padding:6px 14px;border-radius:6px;cursor:pointer;font:500 13px Inter}
.seg button.on{background:var(--ember);color:#fff}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--mute);padding:8px 12px;cursor:pointer;font:500 13px Inter;border-bottom:2px solid transparent}
nav button.on{color:var(--text);border-color:var(--ember)}
.search{margin-left:auto;position:relative}
.search input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;width:190px;font:13px Inter}
.sugg{position:absolute;right:0;top:40px;width:300px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;max-height:340px;overflow:auto;display:none}
.sugg div{padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sugg div:hover{background:#262121}
main{max-width:1240px;margin:0 auto;padding:22px}
.glask{display:flex;gap:16px;align-items:flex-start;background:linear-gradient(135deg,#1f1613,#151313);border:1px solid #3a2a24;border-radius:12px;padding:16px 18px;margin-bottom:20px}
.glask .who{font:700 13px Cinzel,serif;color:var(--ember2);letter-spacing:.1em;white-space:nowrap;padding-top:2px}
.glask em{color:var(--bone)}
.glask p{margin:0 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi .v{font:600 26px Inter;color:var(--text)}
.kpi .l{color:var(--mute);font-size:12px}
.kpi.alert .v{color:var(--ember2)}
.kpi .s{color:var(--dim);font-size:11px;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pies{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px;align-items:stretch}.pies>.card{margin-bottom:16px}
@media(max-width:1000px){.pies{grid-template-columns:1fr}}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.search input{width:160px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h3{margin:0 0 12px;font:600 13px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.card h3 .n{background:var(--ember);color:#fff;border-radius:999px;padding:1px 9px;font-size:12px;letter-spacing:0}
.hint{color:var(--dim);font-size:12px;margin:-6px 0 12px}
.rankbar{display:flex;align-items:center;gap:10px;margin:6px 0}
.rankbar .nm{width:130px;color:var(--mute);font-size:13px}
.rankbar .tr{flex:1;height:10px;background:var(--panel2);border-radius:5px;overflow:hidden}
.rankbar .fl{height:100%;background:var(--bone);opacity:.75}
.rankbar .ct{width:44px;text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--dim);font-weight:500;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;font-size:12px}
td{padding:7px 8px;border-bottom:1px solid #221e1e;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#1c1818}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:11px;color:var(--mute);margin-right:4px}
.tag.red{border-color:#5a2a20;color:var(--ember2)}.tag.ok{border-color:#2d4a33;color:var(--ok)}.tag.warn{border-color:#5a4520;color:var(--warn)}
.link{color:var(--bone);text-decoration:underline dotted;cursor:pointer}
details{border-bottom:1px solid #221e1e}
summary{padding:9px 4px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary .c{margin-left:auto;color:var(--mute);font-size:12px}
details .inner{padding:0 4px 10px 22px;color:var(--mute);font-size:12.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.app input,.app select,.app textarea,.filters select,.filters input,.pl-box select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font:13px Inter}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(860px,100%);background:#141212;border-left:1px solid var(--line);z-index:17;transform:translateX(100%);transition:transform .2s;overflow:auto}
.drawer.open{transform:none}
.pl-wrap{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:15;display:flex;align-items:flex-start;justify-content:center;padding:3vh 2vw;overflow:auto}
.pl-box{background:#141212;border:1px solid var(--line);border-radius:10px;width:min(1300px,100%);padding:16px}
.pl-head{display:flex;gap:10px;align-items:center}
.pl-grid{display:grid;grid-template-columns:260px 1fr;gap:12px}
@media(max-width:800px){.pl-grid{grid-template-columns:1fr}}
.eqp{background:linear-gradient(160deg,#2a2420,#1a1714 60%,#211c18);border:2px solid #6b5a42;border-radius:4px;box-shadow:inset 0 0 0 2px #1a140f,inset 0 0 0 3px #8a7556;margin-bottom:16px}
.drawer .eqp{margin:0;border-radius:0;min-height:100%}
.eqh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:2px solid #6b5a42;background:linear-gradient(#4a3f33,#2c251f);flex-wrap:wrap}
.drawer .eqh{position:sticky;top:0;z-index:3}
.eqh h2{margin:0;font:700 20px Cinzel,serif;letter-spacing:2px;color:#efe3c4;display:inline}
.eqh .sub{color:#b5aea3;font-size:12.5px;margin-left:10px}
.eqh .x{width:26px;height:26px;border:1px solid #8a7556;color:#f6d75a;font-weight:700;background:#2a241e;cursor:pointer;border-radius:2px}
.eqtabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:2px solid #6b5a42;background:#1c1814;flex-wrap:wrap}
.drawer .eqtabs{position:sticky;top:44px;z-index:2}
.eqtabs button{background:linear-gradient(#3a322a,#231e19);border:1px solid #6b5a42;border-bottom:none;color:#b5aea3;padding:6px 12px;font:600 12.5px Inter;cursor:pointer;border-radius:3px 3px 0 0}
.eqtabs button[aria-selected=true]{background:linear-gradient(#6b5a32,#3a3020);color:#f6d75a;border-color:#a8914f}
.eqbody{padding:14px}
.eqp .card{background:#0e0c0a;border:1px solid #5a4b37;border-radius:2px;box-shadow:inset 0 0 0 1px #000}
.eqp .card h3{color:#f6d75a}
.eqinv{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px}
.eqstats{background:#0e0c0a;border:1px solid #5a4b37;border-radius:2px;box-shadow:inset 0 0 0 1px #000;padding:12px;font-size:12.5px;align-self:start}
.eqstats div{display:flex;justify-content:space-between;gap:6px;padding:2px 0}.eqstats div span:first-child{color:#9b958c}.eqstats div span:last-child{color:#7ed36f;font-weight:600;text-align:right}
.eqstats hr{border:0;border-top:1px solid #24211e;margin:6px 0}
.eqgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-areas:'ear1 head face ear2' 'chest mid mid neck' 'arms mid mid back' 'waist mid mid shoulders' 'wrist1 mid mid wrist2' 'legs hands charm feet' 'finger1 finger2 power .' 'primary secondary range ammo';gap:8px;max-width:560px}
.eqmid{grid-area:mid;border:2px solid #5a4b37;border-radius:2px;background:radial-gradient(ellipse at center,#2a3340 0%,#0b0d12 80%);box-shadow:inset 0 0 0 1px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.eqmid b{font:600 20px Cinzel,serif;letter-spacing:2px;color:#efe3c4}.eqmid .pc{font-size:28px;font-weight:700;margin-top:12px;color:#e9e3d8}
.eqs{position:relative;min-height:70px;padding:6px 7px;border:2px solid #3e6b3a;border-radius:2px;background:linear-gradient(#24201b,#14110e);box-shadow:inset 0 0 0 1px #000,inset 0 1px 0 #4a4236;display:flex;flex-direction:column;cursor:default;outline:none}
.eqs.old{border-color:#6b5a2a}.eqs.emp{border-color:#6b2a2a}.eqs.unk{border-color:#3a342c}
.eqs:hover,.eqs:focus{box-shadow:inset 0 0 0 1px #000,0 0 0 1px #f6d75a}
.eqs .sl{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#8a847b}
.eqs .nm{font-size:11.5px;line-height:1.2;margin-top:3px;font-weight:600;color:#efe3c4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.eqs.emp .nm{color:#e5797c}.eqs .dots{display:flex;gap:3px;margin-top:auto;padding-top:5px;flex-wrap:wrap}
.eqs .dots i{width:8px;height:8px;border-radius:50%;background:#9fd28f}.eqs .dots i.o{background:#e0c27a}.eqs .dots i.e{background:#e5797c}
.eqtip{display:none;position:absolute;top:100%;left:0;margin-top:6px;width:330px;z-index:20;background:#0b0a09;border:1px solid #8a7556;box-shadow:0 10px 30px rgba(0,0,0,.7);padding:10px 12px;font-size:12.5px;cursor:auto}
.eqs.r .eqtip{left:auto;right:0}.eqs:hover .eqtip,.eqs:focus .eqtip,.eqs:focus-within .eqtip{display:block}
.eqtip .tn{font-weight:700;font-size:14px;color:#f6d75a}.eqtip .ts{color:#9b958c;margin:2px 0 8px}
.eqtip .ta{display:flex;gap:8px;padding:3px 0;border-top:1px solid #2a2622;align-items:baseline}.eqtip .ta .t{width:52px;flex:none;color:#8a847b}.eqtip .ta .n{flex:1}
.eqtip .tf{color:#8a847b;margin-top:8px;font-size:12px}
.eqleg{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#8a847b;font-size:12px}.eqleg s{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;text-decoration:none}
@media(max-width:700px){.eqinv{grid-template-columns:1fr}.eqtip{width:260px}}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:none}.pl-wrap~.shade,body:has(.pl-wrap) .shade{z-index:16}
.shade.open{display:block}
.dh{padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#141212}
.dh h2{margin:0;font:700 22px Cinzel,serif;color:var(--bone);letter-spacing:.05em}
.dh .x{position:absolute;right:16px;top:16px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:4px 10px;cursor:pointer}
.db{padding:16px 22px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0 4px}
.facts div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.facts b{display:block;font-size:16px}.facts span{color:var(--dim);font-size:11px}
.app dl{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;margin:0}
.app dt{color:var(--dim);font-size:12px}.app dd{margin:0;font-size:13px}
.more{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:5px 10px;cursor:pointer;margin-top:8px}
footer{color:var(--dim);font-size:11.5px;text-align:center;padding:20px}

#menuBtn{display:none;background:none;border:1px solid var(--line);border-radius:8px;width:40px;height:36px;padding:9px 9px;cursor:pointer;flex-direction:column;justify-content:space-between}
#menuBtn span{display:block;height:2px;background:var(--bone);border-radius:2px}
#navDrawer{position:fixed;top:0;left:0;height:100%;width:min(300px,85vw);background:#141212;border-right:1px solid var(--line);z-index:12;transform:translateX(-100%);transition:transform .2s;overflow:auto;padding-bottom:20px}
#navDrawer.open{transform:none}
#navShade{z-index:11}
.nd-head{display:flex;align-items:center;justify-content:space-between;padding:16px}
.nd-head .x{background:none;border:1px solid var(--line);color:var(--mute);border-radius:6px;padding:4px 10px;cursor:pointer}
#nav2 button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--mute);padding:12px 20px;font:500 15px Inter;cursor:pointer}
#nav2 button.on{color:var(--text);border-left-color:var(--ember);background:#1c1717}
.pagetitle{display:none;font:600 14px Inter;color:var(--text)}
@media(max-width:1100px){#menuBtn{display:flex}nav#nav{display:none}.bar{gap:10px;padding:10px 14px}.brand small{display:none}.brand h1{font-size:17px}.pagetitle{display:block}
 .search{order:10;flex-basis:100%;margin-left:0}.search input{width:100%!important}.sugg{left:0;right:0;width:auto}#gsel{margin-left:auto}}
@media(max-width:600px){main{padding:14px}.brand .logo{width:30px;height:30px}.kpis{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:repeat(2,1fr)}table{font-size:12px}td,th{padding:6px 5px}.card{padding:12px}.glask{padding:12px;gap:8px;flex-direction:column}}
.card>h3.ct{cursor:pointer;user-select:none;justify-content:flex-start}.card>h3.ct>:last-child:not(:only-child),.card>h3.ct>span:last-child{margin-left:auto}.card>h3.ct::before{content:'▾';display:inline-block;width:14px;margin-right:6px;color:var(--dim);transition:transform .15s}
.card.cz>h3.ct::before{transform:rotate(-90deg)}.card.cz>h3.ct{margin-bottom:0}.card.cz>*:not(h3){display:none!important}
.bang{display:inline-block;color:#fff;background:var(--ember);border-radius:50%;width:16px;height:16px;line-height:16px;text-align:center;font-size:12px;margin:0 4px 0 2px;cursor:help}
.aag{margin-top:7px;min-width:90px}.aat{position:relative;height:6px;border-radius:3px;background:linear-gradient(90deg,#c8452c,#d9a441 50%,#6fae7c)}
.aat i{position:absolute;top:-4px;width:4px;height:14px;margin-left:-2px;background:#f2e8d8;border-radius:2px;box-shadow:0 0 0 1px #000}
.aat b{position:absolute;top:-2px;width:1px;height:10px;background:rgba(0,0,0,.7)}.aag.big .aat{height:10px}.aag.big .aat i{top:-4px;height:18px}
.aal{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:4px}
.board{display:grid;grid-template-columns:repeat(6,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.bcol{background:#141111;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.bcol h4{margin:2px 4px 10px;font:600 12px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
.bcol h4 span{color:var(--dim)}.bcol .empty{color:var(--dim);text-align:center;padding:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer}.rc:hover{border-color:var(--ember)}
.rc .rt{display:flex;justify-content:space-between;align-items:center;gap:6px}.rc .rm{color:var(--mute);font-size:12px;margin-top:3px}
.rc .rf{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.rc .rf .tag{font-size:11px}
.bar6{display:flex;align-items:center;gap:3px;margin-top:8px}.bar6 i{flex:1;height:6px;border-radius:3px;background:#2a2321}.bar6 i.on{background:var(--ember)}
.bar6 i.sme{box-shadow:inset 0 -2px 0 var(--warn)}.bar6 span{font-size:11px;color:var(--mute);margin-left:6px}
.seg.stg{flex-wrap:wrap}button.more.on{border-color:var(--ember);color:var(--ember2)}
@media(max-width:1100px){.board{grid-template-columns:1fr}}
#pipModal{display:none;position:fixed;inset:0;z-index:20;overflow:auto;padding:40px 16px;pointer-events:none}#pipModal.open{display:block}
#pipModal .pm{pointer-events:auto;max-width:760px;margin:0 auto;background:#141212;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#pipModal label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap}.me img{width:28px;height:28px;border-radius:50%}
.me span{display:flex;flex-direction:column;line-height:1.15}.me small{color:var(--mute);font-size:11px}.me a{color:var(--mute);text-decoration:none;font-size:16px;padding:4px}
@media(max-width:1100px){.me span{display:none}}
/* Baja mode: Fupa's crest. Hidden until someone types "baja" anywhere; every rule hangs off body.baja so normal Glask is untouched. */
body.baja{--bg:#06110f;--panel:#0c1a18;--panel2:#112422;--line:#1c3a35;--text:#e6f2ee;--mute:#8fb3ab;--dim:#5f8780;--ember:#18a897;--ember2:#3fe0cc;--bone:#f3d27a;--ok:#4fe3cf;--warn:#e8b94a;
 background:radial-gradient(ellipse at 15% -10%,rgba(40,200,180,.16),transparent 55%),radial-gradient(ellipse at 100% 110%,rgba(40,200,180,.10),transparent 50%),var(--bg) fixed}
body.baja::before{content:'';position:fixed;right:-6vmin;bottom:-6vmin;width:62vmin;height:62vmin;background:url(/baja.webp) center/contain no-repeat;opacity:.06;pointer-events:none;z-index:-1;border-radius:50%}
body.baja header{background:rgba(6,17,15,.95);border-bottom-color:#b8902e}

body.baja .brand h1{position:relative;padding:0 42px;color:#f3d27a;text-shadow:0 0 8px rgba(63,224,204,.35)}

body.baja .brand h1::before{left:0}
body.baja .brand h1::after{right:0;transform:scaleX(-1)}

<body>
<script>try{if(localStorage.getItem('glask-baja')==='1')document.body.classList.add('baja')}catch(e){}</script>
<header><div class="bar">
  <button id="menuBtn" aria-label="Menu" onclick="openNav()"><span></span><span></span><span></span></button>
  <div class="brand"><img src="data:image/png;base64,__MASK__" alt="Glask" class="logo">
  <div><h1>GLASK</h1><small>Harbinger of the Faceless</small></div></div>
  <div class="pagetitle" id="ptitle"></div>
  <div class="seg" id="gsel"></div>
  <nav id="nav"></nav>

</div></header>

<footer id="foot"></footer>

<div id="pipModal"></div>
<script id="data" type="application/json">__DATA__</script>
<script id="me" type="application/json">__ME__</script>
<script id="kv" type="application/json">__STORE__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
{const _f=window.fetch.bind(window);let told=false;window.fetch=async(...a)=>{const r=await _f(...a);
  if(r.status===401&&String(a[0]).startsWith('/api/')&&!told){told=true;setTimeout(()=>{if(confirm("You've been signed out of Glask (sign-ins last 12 hours). Sign in again now?"))location.href='/login';else setTimeout(()=>told=false,60000)},50)}return r}}
D.guilds.forEach(x=>x.members.forEach(m=>{m._srv=x.server}));   // each member knows its guild (loot review start date)
const ME=JSON.parse(document.getElementById('me').textContent);
const KV=JSON.parse(document.getElementById('kv').textContent);
// Item slots Glask has learned (inventories + officer tags) fill in items the loot sheet can't place
function slotMap(){const m={};const add=o=>Object.entries(o||{}).forEach(([k,v])=>m[k.toLowerCase().replace(/`/g,"'").trim()]=v);
  add(KV['glask-slots-all']);return m}   // officer tags + inventories, on top of the item database
function applySlots(){const S0=slotMap(),SL=new Proxy({},{get:(_,k)=>S0[String(k).toLowerCase().replace(/`/g,"'").trim()]});D.guilds.forEach(x=>x.members.forEach(m=>{(m.cur||[]).forEach(i=>{if(SL[i[1]])i[4]=SL[i[1]]});
  (m.cur||[]).filter(i=>i[2]===m.main&&i[4]&&i[4]!=='Not gear').forEach(i=>i[4].split('/').forEach(s=>{const l=m.slot_last[s];if(!l||!/^\d{4}-/.test(l[0])||i[0]>l[0])m.slot_last[s]=[i[0],i[1],i[5]]}));
  const mine=(m.cur||[]).filter(i=>i[2]===m.main);m.cur_main=mine.length;m.cur_slots=[...new Set(mine.filter(i=>i[4]&&i[4]!=='Not gear').flatMap(i=>i[4].split('/')))].sort()}))}
async function tagSlot(item,slot){const r=await fetch('/api/slots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:{[item]:slot||null},manual:true})});
  if(!r.ok){alertBox('Not saved ('+r.status+')');return}KV['glask-slots-all']=await r.json();applySlots();alertBox(slot?`${item} → ${slot}`:`Cleared ${item}`);render();const o=$('#drawer').dataset.main;if($('#drawer').classList.contains('open')&&o)profile(o)}
function learnSlots(inv){const items={};inv.filter(w=>w.slot!=='Ammo'&&w.item&&w.item!=='Empty').forEach(w=>items[w.item]=w.slot);
  fetch('/api/slots',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items})}).then(r=>r.ok?r.json():null).then(j=>{if(j){KV['glask-slots-all']=j;applySlots()}})}
// Gear: keep only loot from the expansion that's current on Daybreak's calendar right now
D.guilds.forEach(x=>{const cal=(D.aa||{})[x.server];if(!cal||!cal.code)return;x.stats.xpac=cal.xpac;
  x.members.forEach(m=>{m.cur=(m.cur||[]).filter(i=>i[5]===cal.code);const mine=m.cur.filter(i=>i[2]===m.main);m.cur_main=mine.length;
    m.cur_slots=[...new Set(mine.filter(i=>i[4]&&i[4]!=='Not gear').flatMap(i=>i[4].split('/')))].sort()})});
applySlots();
try{applySeen()}catch(e){}
function otherServer(gi){return D.guilds[gi].server==='Mischief'?'Teek':'Mischief'}
function lootRefresh(){alertBox('Reading the loot sheets…');fetch('/api/loot-refresh',{method:'POST'}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(s=>{const bad=Object.entries(s).filter(([k,v])=>!v.ok);if(bad.length)alertBox('Loot refresh failed: '+bad.map(([k,v])=>k+': '+v.msg).join(' · '));else{alertBox('Loot refreshed. Reloading…');setTimeout(()=>location.reload(),800)}}).catch(e=>alertBox('Loot refresh failed ('+e+')'))}
function gIdx(s){const i=D.guilds.findIndex(x=>x.server===s);return i<0?G:i}
let AS_MEMBER=false;   // "My character" is always shown exactly as a member sees it, whatever your rank
function isMem(gi){return AS_MEMBER||ME.access[D.guilds[gi].server]==='member'}
function isOff(gi){if(AS_MEMBER)return false;return ME.access[D.guilds[gi].server]==='officer'}
function kvGet(k){return k in KV?KV[k]:null}
let SAVES=null;
async function kvPost(k,v){try{const r=await fetch('/api/kv',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:k,value:v})});
  if(r.ok)return {ok:true};if(r.status===401)return {ok:false,msg:'your sign-in expired, sign in again',auth:true};
  let d='';try{d=(await r.json()).detail}catch(e){}return {ok:false,msg:d||('server said '+r.status)}}catch(e){return {ok:false,msg:'could not reach Glask'}}}
function kvSet(k,v){KV[k]=v;const pr=kvPost(k,v);
  if(SAVES)SAVES.push({k,pr});else pr.then(r=>{if(!r.ok){alertBox('Not saved: '+r.msg);if(r.auth)setTimeout(()=>location.href='/login',2500)}});return pr}
let G=0, V=(Object.values(ME.access).every(a=>a==='member')?'me':'overview'), inactiveRank='Raider', rosterSort={k:'main',d:1}, rosterRank='', rosterFilter='';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const g=()=>D.guilds[G];
const fmt=n=>Number(n).toLocaleString();
const ago=d=>d==null?'never':d===0?'today':d===1?'yesterday':d+'d ago';
const ALLVIEWS=[['overview','Overview'],['cleanup','Cleanup'],['roster','Roster'],['perf','Performance'],['ach','Achievements'],['launch','Launch planning'],['recruit','Recruitment'],['uploads','⇪ Uploads']];

function lootDate(t,tab){return /^\d{4}-\d\d-\d\d/.test(t)?t.slice(0,10):(t||tab)}

function openNav(){$('#navDrawer').classList.add('open');$('#navShade').classList.add('open')}
function closeNav(){$('#navDrawer').classList.remove('open');$('#navShade').classList.remove('open')}
const RECRUIT_VIEWS=['overview','roster','ach','recruit','uploads'];
function viewsFor(gi){return isMem(gi)?[['me','My character']]:(isOff(gi)?ALLVIEWS:ALLVIEWS.filter(v=>RECRUIT_VIEWS.includes(v[0]))).concat([['me','My character']])}
let VIEWS=ALLVIEWS;
function renderShell(){VIEWS=viewsFor(G);{const s=document.querySelector('.search');if(s)s.style.display=isMem(G)?'none':''}if(!VIEWS.some(v=>v[0]===V))V=VIEWS[0][0];
  $('#gsel').innerHTML=D.guilds.map((x,i)=>`<button class="${i===G?'on':''}" onclick="G=${i};render()">${x.server}</button>`).join('');
  $('#nav').innerHTML=VIEWS.map(([k,l])=>`<button class="${k===V?'on':''}" onclick="V='${k}';render()">${l}</button>`).join('');
  $('#nav2').innerHTML=VIEWS.map(([k,l])=>`<button class="${k===V?'on':''}" onclick="V='${k}';closeNav();render();window.scrollTo(0,0)">${l}</button>`).join('');
  $('#gsel2').innerHTML=$('#gsel').innerHTML;
  $('#meChip').innerHTML=`${ME.avatar?`<img src="${ME.avatar}" alt="">`:''}<span>${esc(ME.name)}<small>${isOff(G)?((ME.lead||[]).includes(D.guilds[G].server)?'Leadership':'Officer'):isMem(G)?'Member':'Recruitment'}</small></span><a href="/logout" title="Sign out">⏻</a>`;
  $('#ptitle').textContent=(VIEWS.find(v=>v[0]===V)||['',''])[1].replace('⇪ ','');
  const ls=(D.loot_status||{})[g().server];
  $('#foot').innerHTML=(isOff(G)&&D.sa_email?`Glask reads Google Sheets as <code>${esc(D.sa_email)}</code> (share sheets with it as Viewer) · `:'')+`Loot: ${ls&&ls.ok?`from the ${g().server} loot sheet, read ${new Date(ls.at*1000).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}, next read Mon/Tue/Thu/Fri 10 AM Eastern (${fmt(g().stats.loot_nights)} tabs)`:`<span style="color:var(--ember2)">${ls&&ls.msg?esc(ls.msg):'snapshot'}</span>`}${isOff(G)?` · <a href="#" onclick="event.preventDefault();lootRefresh()" style="color:var(--ember2)">Refresh now</a>`:''} · Guild dumps from ${D.generated} and application sheet · <a href="/privacy" style="color:inherit">Privacy</a> · <a href="/terms" style="color:inherit">Terms</a> · inactive = no character online in ${D.inactive_days}+ days`;
}

function glaskSay(){
  const s=g().stats;
  return `<div class="glask"><div class="who">GLASK</div><div>
  <p><em>“The Faceless sees all.”</em> ${g().guild} on ${g().server} holds <b>${fmt(s.chars)}</b> characters belonging to <b>${fmt(s.mains)}</b> people.</p>
  <p>I found <b>${s.departed_alts}</b> alts still in the guild whose mains have left (${s.departed_mains} departed mains), <b>${s.unreadable}</b> alts that can't link to a main, and <b>${s.inactive_raiders}</b> of ${s.raiders} Raiders with no character online in ${D.inactive_days}+ days.</p></div></div>`;
}


const ROLES=[['Tanks',['Warrior','Paladin','Shadow Knight'],'#c8452c'],['Melee',['Monk','Rogue','Berserker','Ranger','Beastlord'],'#d9a441'],['Casters',['Wizard','Magician','Necromancer'],'#6f8fd1'],['Support',['Bard','Enchanter'],'#a27bc9'],['Healers',['Cleric','Shaman','Druid'],'#6fae7c']];
const RANKCOL=['#d9cbb4','#c8452c','#d9a441','#6f8fd1','#6fae7c','#a27bc9','#7d756f','#4fa3a5','#b5657a'];
function donut(slices,total,label){const R=80,r=50,cx=100,cy=100;let a=-Math.PI/2;const sum=slices.reduce((s,x)=>s+x[1],0)||1;
  const paths=slices.filter(s=>s[1]>0).map(([name,n,col])=>{const da=2*Math.PI*n/sum;const a2=a+da;const large=da>Math.PI?1:0;
    const p=sum===n?`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`:
      `M${cx+R*Math.cos(a)} ${cy+R*Math.sin(a)}A${R} ${R} 0 ${large} 1 ${cx+R*Math.cos(a2)} ${cy+R*Math.sin(a2)}L${cx+r*Math.cos(a2)} ${cy+r*Math.sin(a2)}A${r} ${r} 0 ${large} 0 ${cx+r*Math.cos(a)} ${cy+r*Math.sin(a)}Z`;
    a=a2;return `<path d="${p}" fill="${col}" stroke="var(--panel)" stroke-width="2"><title>${esc(name)}: ${n} (${Math.round(100*n/sum)}%)</title></path>`}).join('');
  return `<svg viewBox="0 0 200 200" style="width:200px;height:200px;flex:none">${paths}<text x="100" y="98" text-anchor="middle" fill="var(--text)" style="font:600 26px Inter">${total}</text><text x="100" y="118" text-anchor="middle" fill="var(--mute)" style="font:11px Inter">${esc(label)}</text></svg>`}
function pieCard(title,hint,slices,total,label,detail){const sum=slices.reduce((s,x)=>s+x[1],0)||1;
  return `<div class="card"><h3>${title} <span class="n">${total}</span></h3>${hint?`<div class="hint">${hint}</div>`:''}<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap">${donut(slices,total,label)}
   <div style="flex:1;min-width:220px">${slices.filter(s=>s[1]>0).map(([name,n,col])=>`<div style="display:grid;grid-template-columns:12px 1fr 40px 44px;column-gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #221e1e"><span style="width:11px;height:11px;border-radius:3px;background:${col}"></span><div><b style="font-weight:500">${esc(name)}</b>${detail&&detail(name)?`<div style="color:var(--dim);font-size:11.5px;line-height:1.35">${detail(name)}</div>`:''}</div><span style="text-align:right;font-variant-numeric:tabular-nums">${n}</span><span style="text-align:right;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums">${Math.round(100*n/sum)}%</span></div>`).join('')}</div></div></div>`}

function overview(){
  const x=g(), s=x.stats, act=x.members.filter(m=>m.days!=null&&m.days<=D.inactive_days);
  const isMainRank=m=>!NONRAID.test(m.rank);
  const activeRaiders=act.filter(isMainRank);
  const activeAlts=act.reduce((n,m)=>n+m.chars.filter(c=>c.a&&(()=>{const p=c.s.split('/');if(p.length<3)return false;const d=new Date(2000+ +p[2],p[0]-1,+p[1]);return (new Date(D.generated)-d)/864e5<=D.inactive_days})()).length,0);
  const byCls={};activeRaiders.forEach(m=>{const c=classOf(m.main,m.cls);byCls[c]=(byCls[c]||0)+1});
  const cls=Object.entries(byCls).sort((a,b)=>b[1]-a[1]); const cmax=Math.max(...cls.map(c=>c[1]),1);
  const byRank={};act.forEach(m=>byRank[m.rank]=(byRank[m.rank]||0)+1); const rk=Object.entries(byRank).sort((a,b)=>b[1]-a[1]); const rmax=Math.max(...rk.map(r=>r[1]),1);
  const pips=x.members.map(m=>[m,pipOf(G,m.main)]).filter(([m,p])=>p&&p.status&&p.status!=='None'&&p.status!=='Closed');
  const fr=x.flag_ref, refs=[...fr.progression,...fr.raids];
  const flagCount=a=>activeRaiders.filter(m=>['yes','seen'].includes(hasAch(m,a))).length;
  const recDays=r=>{const m=(r.note||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(!m)return null;const y=+m[3]<100?2000+ +m[3]:+m[3];return Math.round((new Date(D.generated)-new Date(y,m[1]-1,+m[2]))/864e5)};
  return `<div class="glask"><div class="who">GLASK</div><div>
   <p><em>“The Faceless sees all.”</em> ${x.guild} on ${x.server} has <b>${act.length}</b> active people (any character online in the last ${D.inactive_days} days), <b>${activeRaiders.length}</b> of them in raiding ranks, playing <b>${fmt(activeAlts)}</b> active alts.</p>
   <p>${x.recruits.length} recruit${x.recruits.length===1?'':'s'} waiting on a rank decision · ${pips.length} on a Performance Improvement Plan · current expansion <b>${esc(xpacNow(G).xpac||s.xpac)}</b>${xpacNow(G).next?` (${esc(xpacNow(G).next.xpac)} unlocks ${new Date(xpacNow(G).next.at).toLocaleDateString([], {month:'short',day:'numeric'})})`:''}. Who's gone quiet lives on the Cleanup tab.</p></div></div>
  <div class="kpis">
   <div class="kpi"><div class="v">${act.length}</div><div class="l">Active people</div><div class="s">of ${fmt(s.mains)} on the roster</div></div>
   <div class="kpi"><div class="v">${activeRaiders.length}</div><div class="l">Active in raiding ranks</div><div class="s">excludes FnF, alt and applicant ranks</div></div>
   <div class="kpi"><div class="v">${fmt(activeAlts)}</div><div class="l">Active alts</div><div class="s">online in the last ${D.inactive_days} days</div></div>
   <div class="kpi"><div class="v">${x.recruits.length}</div><div class="l">Recruits</div><div class="s">applicant rank or "Recruit" note</div></div>
   <div class="kpi ${pips.length?'alert':''}"><div class="v">${pips.length}</div><div class="l">On a PIP</div><div class="s">open or improving</div></div>
  </div>
  <div class="pies">${pieCard('Active people by rank','',rk.map(([r,n],i)=>[r,n,RANKCOL[i%RANKCOL.length]]),act.length,'active')}
   ${(()=>{const roleOf=c=>(ROLES.find(r=>r[1].includes(c))||['Other'])[0];const per={};activeRaiders.forEach(m=>{const c=classOf(m.main,m.cls);(per[roleOf(c)]??={})[c]=(per[roleOf(c)][c]||0)+1});
     const sl=ROLES.map(([n,_,col])=>[n,Object.values(per[n]||{}).reduce((a,b)=>a+b,0),col]);if(per.Other)sl.push(['Other',Object.values(per.Other).reduce((a,b)=>a+b,0),'#7d756f']);
     return pieCard('Active raiders by role','Class from the guild dump, unless an officer set a raid class. Hover a slice for its share.',sl,activeRaiders.length,'raiders',n=>Object.entries(per[n]||{}).sort((a,b)=>b[1]-a[1]).map(([c,k])=>`<span style="white-space:nowrap">${c} ${k}</span>`).join(' · '))})()}</div>
  <div class="card"><h3>Performance Improvement Plans <span class="n">${pips.length}</span></h3>${pips.length?`<table><tr><th>Member</th><th>Status</th><th>Concern</th><th>Review</th></tr>${pips.map(([m,p])=>`<tr class="click" onclick="openPip(G,'${esc(m.main)}')"><td>${esc(m.main)}</td><td><span class="tag red">${esc(p.status)}</span></td><td>${esc(p.concern)}</td><td>${esc(p.review||'')}</td></tr>`).join('')}</table>`:'<div class="hint" style="margin:0">Nobody on a PIP. Open one from any profile.</div>'}</div>

  const preEoK=!Object.keys(XPNAME).some(k=>k.toLowerCase()===now),OLD=preEoK?'older':'pre-EoK',OLDT=preEoK?'From an earlier expansion':'Older than Empires of Kunark';   /* a server still before EoK: undated items are just older */

    inv.forEach(w=>{const pr=EQ_PAIR[w.slot];const a=pr?pr[Math.min((seen[w.slot]=(seen[w.slot]||0)+1)-1,1)]:EQ_AREA[w.slot];if(!a||out[a])return;
      const empty=!w.item||w.item==='Empty';const got=(m.cur||[]).find(i=>i[1]===w.item);const l=m.slot_last[w.slot];
      const wx=w.xp||(got&&got[5])||(l&&l[1]===w.item?l[2]:null);const t=augTypes(w)||[];const ax=w.axp||[];
      const augs=w.augs.map((n,i)=>({n,t:t[i],skip:n==='Empty'&&augSkip(w,i),xp:ax[i]}));
      const dots=augs.filter(x=>!x.skip).map(x=>`<i class="${x.n==='Empty'?'e':isCur(x.xp)?'':'o'}" title="${esc(x.n)}"></i>`).join('');
      const cls=empty?'emp':isCur(wx)?'':'old';
      const tip=empty?`<div class="tn">Empty</div><div class="tf">${lastBuy(w.slot)}</div>`:`<div class="tn">${esc(w.item)}</div>
        <div class="ts">${wx?`<span class="tag ${isCur(wx)?'ok':'warn'}">${esc(wx)}</span> ${esc(XPNAME[wx]||(isCur(wx)&&xpacNow(gi).xpac)||wx)}`:`<span class="tag warn">${OLD}</span> ${OLDT.toLowerCase()}`}${got?` · bought with DKP ${esc(got[0])}`:''}</div>
        ${augs.map(x=>`<div class="ta"><span class="t">${x.t?'type '+x.t:'aug'}</span><span class="n" style="color:${x.n==='Empty'?(x.skip?'#6d6560':'#e5797c'):'#e9e3d8'}">${x.n==='Empty'?(x.skip?'empty (not needed)':'empty'):esc(x.n)}</span>${x.n==='Empty'?'':`<span class="tag ${isCur(x.xp)?'ok':'warn'}" title="${esc(x.xp?XPNAME[x.xp]||x.xp:OLDT)}">${esc(x.xp||OLD)}</span>`}</div>`).join('')}
        <div class="tf">${got?'':'Not bought with DKP (crafted, raid currency, quest or vendor). '}${lastBuy(w.slot)}</div>`;
      out[a]={a,slot:EQ_LABEL[w.slot]||w.slot,name:empty?'Empty':w.item,cls,dots,tip,w,wx,augs,empty}})}
  EQ_ALL.forEach(a=>{if(out[a])return;const sl=EQ_SLOT_OF(a);out[a]={a,slot:EQ_LABEL[sl]||sl,name:inv?'Empty':'—',cls:inv?'emp':'unk',dots:'',tip:`<div class="tn">${esc(EQ_LABEL[sl]||sl)}</div><div class="ts">${inv?'Nothing worn here.':'Upload an inventory to see what is worn.'}</div><div class="tf">${lastBuy(sl)}</div>`,empty:!!inv,augs:[]}});
  return out}
function eqInvTab(m,gi){const x=D.guilds[gi],inv=invOf(m,gi),C=eqCells(m,gi),now=xpacNow(gi).code||'',ax=achOf(m,gi),dup=openDups(m,gi);

  const emptyAugs=Object.values(C).flatMap(c=>c.augs.filter(a=>a.n==='Empty'&&!a.skip).map(a=>[c,a]));
  const older=worn.filter(c=>c.cls==='old');
  const issues=[...(Object.keys(dup).length&&!isMem(gi)?Object.entries(dup).map(([s,l])=>`<div style="padding:5px 0;border-top:1px solid #24211e"><b class="bang">!</b> <b>${esc(s)}</b> ×${l.length} this expansion, more than the slot holds<div style="color:#8a847b;font-size:12px">${l.map(i=>`${esc(i[1])} ${esc(i[0])}`).join('; ')}</div></div>`):[]),

   <section aria-label="Equipped gear"><div class="eqgrid"><div class="eqmid"><b>${esc(m.cls)}</b>${(()=>{const mc=m.chars.find(c=>c.n===m.main)||{};const b=baseOf(mc,gi);return b&&b!==m.cls?`<div style="color:#9b958c;margin-top:4px">base ${esc(b)}</div>`:''})()}
     ${inv?`<div class="pc">${worn.length?Math.round(curN*100/worn.length):0}%</div><div style="color:#9b958c;font-size:12px">of worn gear from ${esc(XPNAME[now]||now)}</div>`:`<div style="color:#9b958c;font-size:12px;margin-top:12px">No inventory on file yet</div>`}</div>
     ${EQ_ALL.map(a=>cell(C[a])).join('')}</div>
     <div class="eqleg"><span><s style="background:#3e6b3a"></s> ${esc(now)}</span><span><s style="background:#6b5a2a"></s> older expansion</span><span><s style="background:#6b2a2a"></s> empty</span><span>Hover or tab to a slot for augs and DKP history · aug dots: <span style="color:#9fd28f">${esc(now)}</span> / <span style="color:#e0c27a">older</span> / <span style="color:#e5797c">empty</span></span></div></section></div>

    ${inv?(issues.length?issues.join(''):'<div class="hint" style="margin:0">Nothing to fix: every worn item is from this expansion and every aug slot that matters is filled.</div>'):`<div class="hint" style="margin:0">Upload an <code>/outputfile inventory</code> to fill in the slots.${issues.length?'':''}</div>${issues.join('')}`}

function profile(name,keep){if(ME.access[D.guilds[G].server]==='member'){closeP();V='me';render();return}   // members never get the officer panel
  const dr=$('#drawer'),st=dr.scrollTop;dr.dataset.main=name;
  let mi=-1,gi=G;
  mi=D.guilds[G].members.findIndex(m=>m.main===name);
  if(mi<0){for(let i=0;i<D.guilds.length;i++){const j=D.guilds[i].members.findIndex(m=>m.main===name);if(j>=0){gi=i;mi=j;break}}}
  if(mi<0)return;
  dr.innerHTML=charPanel(D.guilds[gi].members[mi],gi,true);
  dr.classList.add('open');$('#shade').classList.add('open');dr.scrollTop=keep?st:0;
}

function aaRef(gi,cls){const r=(D.aa||{})[D.guilds[gi].server];if(r&&r.ag_through)r.thru=r.ag_through;cls=normCls(cls);if(!r||!r.ag[cls])return null;return {ag:r.ag[cls],max:r.max[cls],buf:D.aa.buffer||400,xpac:r.xpac,thru:r.ag_through,cls}}

function pipeline(gi=G){const x=D.guilds[gi],R=recs(gi),S=recSet(gi),out={};

async function linkChar(gi,form){const char=form.c.value.trim();if(!char)return;
  const r=await fetch('/api/link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({server:D.guilds[gi].server,char})});
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){}alertBox(d||('Not saved ('+r.status+')'));return}
  const j=await r.json();alertBox(j.status==='approved'?`Linked to ${j.main}. Loading your character…`:`Request sent for ${j.main}. An officer will approve it.`);setTimeout(()=>location.reload(),900)}
function perfSummary(m,gi){const names=new Set(m.chars.map(c=>c.n));let rows=[];allRaids(gi).forEach(r=>r.players.forEach(p=>{if(names.has(p.name))rows.push([r,p])}));
  const mainRows=rows.filter(([,p])=>p.name===m.main);if(mainRows.length)rows=mainRows;   // your main's raids, not your boxes
  if(!rows.length)return '';const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
  const pct=Math.round(avg(rows.map(([,p])=>p.pct||0))),up=Math.round(avg(rows.map(([,p])=>(p.uptime||0)*100))),top=rows.filter(([,p])=>p.rank&&p.of&&p.rank<=Math.ceil(p.of/2)).length;
  const word=pct>=110?'well above':pct>=95?'right around':pct>=80?'a bit below':'below';
  return `<div class="card"><h3>Your performance, overall <span style="text-transform:none;letter-spacing:0;color:var(--dim)">${esc(rows[0][1].name)} · ${esc(rows[0][1].cls||'')}</span></h3>
   <div class="facts"><div><b>${pct}%</b><span>of your class's median, on average</span></div><div><b>${top} / ${rows.length}</b><span>raids in the top half of your class</span></div><div><b>${up}%</b><span>average time active</span></div><div><b>${rows.length}</b><span>raid logs you're in</span></div></div>
   <div class="hint" style="margin:10px 0 0">Across ${rows.length} raid log${rows.length>1?'s':''}, you're ${word} the middle of your class. “vs class” compares you to the median of everyone playing your class in that raid; boxes, the raid leader and anyone active less than 30% of the fight aren't counted. Healers are measured on healing per second, everyone else on damage per second while active.</div></div>`}
function charHeader(m,gi){const x=D.guilds[gi],ax=achOf(m,gi);
  return `<div class="card"><h3>${esc(m.main)} <span class="tag">${esc(x.guild)}</span></h3>
   <div class="facts"><div><b>${esc(m.cls)}</b><span>class${(()=>{const mc=m.chars.find(c=>c.n===m.main)||{};const b=baseOf(mc,gi);return b&&b!==m.cls?' (base '+esc(b)+')':''})()}</span></div><div><b>${esc(m.level||'?')}</b><span>level</span></div><div><b>${esc(m.rank||'?')}</b><span>rank</span></div><div><b>${aaText(ax)}</b><span>AA ${ax?'(from your achievement export)':'(upload your achievement export)'}</span></div></div>
   ${m.chars.length>1?`<div style="margin-top:10px;color:var(--mute);font-size:13px">Your characters: ${m.chars.map(c=>`${esc(c.n)} <span style="color:var(--dim)">${esc(c.c)} ${esc(c.l||'')}</span>`).join(' · ')}</div>`:''}</div>`}
function signupCard(m,gi){const s=signupOf(gi),st=latestQStatus(m,gi),qs=allQ(gi);
  if(!s&&!qs.length)return '';
  return `<div class="card" style="border-color:${s&&!st?'#5a4520':'var(--line)'}"><h3>Expansion launch sign-up${s?' · '+esc(s.title||''):''}</h3>
   ${s?`<p style="margin:0 0 10px">${st?`You've responded${qs[0]?' to '+esc(qs[0].title):''}: ${st==='Available'?'<span class="tag ok">Available</span>':st==='Partial'?'<span class="tag warn">Partial</span>':st==='Unavailable'?'<span class="tag red">Unavailable</span>':'<span class="tag">'+esc(st)+'</span>'}. You can update your answers with the same form.`:"Leadership is planning the next launch. Let them know when you can raid."}${s.due?' Please answer by <b>'+esc(s.due)+'</b>.':''}</p>
     <a class="more" href="${esc(s.url)}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">${st?'Open the sign-up form':'Sign up for launch'}</a>`
    :`<p style="margin:0">${st?`Your response to ${esc(qs[0].title)}: <b>${esc(st)}</b>.`:'No launch sign-up is open right now.'}</p>`}</div>`}
function memberUploadCard(gi){const own=D.guilds.flatMap(x=>(KV['glask-uploads-'+x.server]||[])).sort((a,b)=>b.at-a.at).slice(0,10);
  return `<div class="card"><h3>Upload your files</h3>
   <div class="hint">Drop any of these here, several at once is fine:<br><b>Inventory</b>: type <code>/outputfile inventory</code> in game, then upload <code>${esc(myMain(gi)?.main||'Name')}_${esc(D.guilds[gi].server.toLowerCase())}-Inventory.txt</code> from your EverQuest folder. It fills in your gear by slot.<br>
   <b>Achievements</b>: <code>/outputfile achievement</code>, then upload <code>…-Achievements.txt</code>. It gives your AA count and achievement progress.<br>
   <b>Raid log</b>: your <code>eqlog_Name_${esc(D.guilds[gi].server.toLowerCase())}.txt</code> from the Logs folder (or a clip of one raid). It adds the raid to everyone's attendance and performance; you'll only see your own numbers.</div>
   <label id="drop" style="display:block;border:2px dashed #4a3a33;border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;background:#141111;margin:4px 0 12px" ondragover="event.preventDefault();this.style.borderColor='var(--ember)'" ondragleave="this.style.borderColor='#4a3a33'" ondrop="event.preventDefault();this.style.borderColor='#4a3a33';handleFiles(event.dataTransfer.files)">
    <div style="font:700 16px Cinzel,serif;color:var(--bone);letter-spacing:.08em">DROP FILES HERE</div><div style="color:var(--mute);margin-top:6px">or click to choose</div>
    <input type="file" multiple accept=".txt" style="display:none" onchange="handleFiles(this.files)"></label>
   ${upLog.length?`<table><tr><th>File</th><th>Detected as</th><th>Status</th><th>Result</th></tr>${upLog.map(u=>`<tr><td>${esc(u.f)}</td><td>${esc(u.kind)}</td><td>${stTag(u.st)}</td><td style="color:${u.ok?'var(--text)':'var(--ember2)'}">${esc(u.msg)}</td></tr>`).join('')}</table>`:''}
   ${own.length?`<div class="hint" style="margin:10px 0 4px">Your recent uploads</div>${own.map(u=>`<div style="font-size:13px;color:var(--mute)">${new Date(u.at*1000).toLocaleDateString([], {month:'short',day:'numeric'})} · ${esc(u.file)} · ${esc(u.kind)}</div>`).join('')}`:''}</div>`}
function me(){AS_MEMBER=true;try{return me0()}finally{AS_MEMBER=false}}
function me0(){const gi=G,x=D.guilds[gi],l=(ME.links||{})[x.server];
  if(!l)return `<div class="glask"><div class="who">GLASK</div><div><p><em>“Show me your face.”</em> Which character is yours in ${esc(x.guild)}?</p>
    <form onsubmit="event.preventDefault();linkChar(${gi},this)" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input name="c" placeholder="Your main's name" autocomplete="off" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;min-width:220px"><button class="more" type="submit">Link my character</button></form>
    <p style="color:var(--mute);font-size:13px;margin-top:10px">If your Discord username matches the one on your guild application, you're linked right away. Otherwise an officer approves it, usually within a day. You only ever see your own character here.</p></div></div>`;
  if(l.status!=='approved')return `<div class="glask"><div class="who">GLASK</div><div><p>Your link to <b>${esc(l.main)}</b> is waiting for an officer to approve it. Check back soon.</p><p style="color:var(--mute);font-size:13px">Wrong character? <a href="#" onclick="event.preventDefault();ME.links['${esc(x.server)}']=null;render()" style="color:var(--ember2)">Request a different one</a>.</p></div></div>`;
  const m=myMain(gi);if(!m)return `<div class="glask"><div class="who">GLASK</div><div><p><b>${esc(l.main)}</b> isn't in the latest ${esc(x.server)} guild roster. If you've changed mains, ask an officer to update your link.</p></div></div>`;
  return charPanel(m,gi,false)}
// ---- officers: approve character links; set the launch sign-up ----
function linksCard(){const x=g(),L=KV['glask-links-'+x.server]||{};const all=Object.entries(L);const pend=all.filter(([,v])=>v.status!=='approved');
  if(!all.length)return '';const when=t=>new Date(t*1000).toLocaleDateString([], {month:'short',day:'numeric'});
  return `<div class="card" style="border-color:${pend.length?'#5a4520':'var(--line)'}"><h3>Member character links <span class="n">${pend.length}</span></h3>
   <div class="hint">Members link their Discord to their main so they can see their own character page. Approve only if this is really their character.</div>
   ${pend.length?`<table><tr><th>Discord</th><th>Wants to link</th><th>Asked</th><th></th></tr>${pend.map(([id,v])=>`<tr><td><b>${esc(v.name)}</b> <span style="color:var(--dim)">@${esc(v.username||'')}</span></td><td>${esc(v.main)}${v.asked&&v.asked.toLowerCase()!==v.main.toLowerCase()?` <span style="color:var(--dim)">(typed ${esc(v.asked)})</span>`:''}</td><td>${when(v.at)}</td><td style="white-space:nowrap"><button class="more" onclick="linkDecide('${id}',1)">Approve</button> <button class="more" onclick="linkDecide('${id}',0)">Deny</button></td></tr>`).join('')}</table>`:'<div class="hint" style="margin:0">No requests waiting.</div>'}
   <details style="margin-top:8px"><summary style="color:var(--mute)">Linked (${all.length-pend.length})</summary><table>${all.filter(([,v])=>v.status==='approved').map(([id,v])=>`<tr><td>${esc(v.name)} <span style="color:var(--dim)">@${esc(v.username||'')}</span></td><td>${esc(v.main)}</td><td style="color:var(--dim)">${esc(v.by||'')}</td><td><button class="more" onclick="linkDecide('${id}',0)">Unlink</button></td></tr>`).join('')}</table></details></div>`}
async function linkDecide(uid,ok){const x=g();if(!ok&&!confirm('Remove this link?'))return;
  const r=await fetch('/api/link-decide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({server:x.server,uid,approve:!!ok})});
  if(!r.ok){alertBox('Not saved ('+r.status+')');return}KV['glask-links-'+x.server]=await r.json();render()}
function signupSetter(){const x=g(),s=signupOf(G)||{};if(!isOff(G))return '';
  return `<div><div class="hint">Members see this on their character page with a “Sign up for launch” button, plus whether they've already answered (from the responses you load here).</div>
   <form onsubmit="event.preventDefault();setSignup(this)" style="display:grid;grid-template-columns:1fr 2fr 1fr auto;gap:8px;align-items:center">
    <input name="t" placeholder="Title, e.g. Shattering of Ro launch" value="${esc(s.title||'')}" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px">
    <input name="u" placeholder="https://forms.gle/…" value="${esc(s.url||'')}" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px">
    <input name="d" placeholder="Answer by (optional)" value="${esc(s.due||'')}" style="background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px">
    <button class="more" type="submit">Save</button></form>${s.url?`<div class="hint" style="margin:8px 0 0">Set by ${esc(s.by||'')}. Clear the link and save to hide it.</div>`:''}</div>`}
async function setSignup(f){const r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({server:g().server,title:f.t.value,url:f.u.value,due:f.d.value})});
  if(!r.ok){let d='';try{d=(await r.json()).detail}catch(e){}alertBox('Not saved: '+(d||r.status));return}const j=await r.json();KV['glask-signup-'+g().server]=j.url?j:null;alertBox('Sign-up link saved');render()}

// every titled card can be collapsed by clicking its title; state remembered per page + card title
function cardKey(c,h){const where=c.closest('#drawer')?'drawer':c.closest('#pipModal')?'pip':V;
  return 'glask-cz-'+where+':'+(h.childNodes[0]?.textContent||h.textContent).replace(/[\d,./×]+/g,'').replace(/\s+/g,' ').trim().slice(0,60)}
function enhanceCards(root=document){root.querySelectorAll('.card').forEach(c=>{if(c.dataset.cz||c.tagName==='DETAILS')return;const h=c.querySelector(':scope>h3');if(!h)return;
  c.dataset.cz='1';h.classList.add('ct');const k=cardKey(c,h);try{if(localStorage.getItem(k)==='1')c.classList.add('cz')}catch(e){}
  h.addEventListener('click',e=>{if(e.target.closest('button,a,input,select,label,textarea'))return;c.classList.toggle('cz');try{localStorage.setItem(k,c.classList.contains('cz')?'1':'0')}catch(e){}})})}
new MutationObserver(()=>{clearTimeout(window._ecT);window._ecT=setTimeout(()=>enhanceCards(),0)}).observe(document.body,{childList:true,subtree:true});
function render(){renderShell();$('#view').innerHTML={overview,cleanup,roster,perf,ach,launch,recruit,uploads,me}[V]()}
render();
</script>
<script>
/* Baja mode (Fupa's crest). Type "baja" anywhere to turn it on or off; remembered per browser. */
(function(){
  const K='glask-baja',logos=[...document.querySelectorAll('.brand .logo')],fav=document.querySelector('link[rel=icon]');
  const orig=logos.map(i=>i.src),origFav=fav&&fav.href;
  function apply(on){document.body.classList.toggle('baja',on);
    logos.forEach((i,n)=>{i.src=on?'/baja.webp':orig[n]});if(fav)fav.href=on?'/baja.webp':origFav}
  function toast(on){let t=document.getElementById('bajaToast');if(!t){t=document.createElement('div');t.id='bajaToast';document.body.appendChild(t)}
    t.innerHTML='<b>GLASK</b>'+(on?'<em>\u201cThe cat has seen you. Drink deep of the Blast.\u201d</em>':'<em>\u201cThe Blast fades. Show me your face.\u201d</em>');
    t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3200)}
  let buf='',last=0;
  function hit(){const now=Date.now();if(now-last<800)return;last=now;buf='';
    const on=!document.body.classList.contains('baja');apply(on);try{localStorage.setItem(K,on?'1':'0')}catch(e){};toast(on)}
  document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||!e.key||e.key.length!==1)return;
    buf=(buf+e.key.toLowerCase()).slice(-4);if(buf==='baja')hit()},true);
  /* phone keyboards often don't report keys, so also watch what lands in a text box */
  document.addEventListener('input',e=>{const v=e.target&&typeof e.target.value==='string'?e.target.value:'';if(/baja$/i.test(v))hit()},true);
  let on=false;try{on=localStorage.getItem(K)==='1'}catch(e){}
  if(on)apply(true);
})();
</script>
